name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # 프로젝트 파일이 저장소 루트가 아니라 이 폴더 아래에 있음
    working-directory: skeleton_v1.1/skeleton

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax check
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/api/subscribers.py
          python -m py_compile app/api/devices.py

      - name: Start server and test health endpoint
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health

      - name: Test dashboard page
        run: |
          curl -f http://localhost:8000/

      - name: Test API endpoints
        run: |
          curl -f http://localhost:8000/api/subscribers
          curl -f http://localhost:8000/api/subscribers/U001/devices
          curl -f http://localhost:8000/api/devices/D001/usage

      - name: Run TE scenario tests
        run: |
          python tests/req1_test_template.py
          python tests/req2_test_template.py

      - name: Upload TE reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-reports
          path: skeleton_v1.1/skeleton/tests/reports/
